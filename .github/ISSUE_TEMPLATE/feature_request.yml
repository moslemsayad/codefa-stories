name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Story management
        - Story viewer
        - Performance
        - Security
        - Accessibility
        - Elementor integration
        - WooCommerce integration
        - Developer API
        - Other
    validations:
      required: true
